<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Peak — engine tests</title>
<style>
  body { font-family: ui-monospace, Menlo, monospace; background:#0f1115; color:#e8eaed; padding:24px; line-height:1.5; }
  h2 { color:#4ade80; margin-top:28px; font-size:15px; }
  .pass { color:#4ade80; } .fail { color:#f87171; font-weight:700; }
  pre { background:#171a21; padding:12px; border-radius:8px; overflow-x:auto; font-size:12px; }
  #summary { position:sticky; top:0; background:#0f1115; padding:10px 0; font-size:18px; font-weight:700; }
</style>
</head>
<body>
<div id="summary">running…</div>
<div id="out"></div>
<script>
  // A thrown error used to leave this page stuck on "running…", which reads as
  // a hang rather than a failure. Always surface it.
  window.addEventListener("error", (e) => {
    document.getElementById("summary").innerHTML =
      `<span class="fail">SUITE CRASHED</span> — ${e.message}`;
    document.getElementById("out").insertAdjacentHTML("beforeend",
      `<div class="fail">✗ Uncaught: ${e.message}<br><small>${(e.error && e.error.stack || "").split("\n").slice(0, 3).join("<br>")}</small></div>`);
  });
</script>
<script type="module">
import {
  buildPlan, computeAdaptation, goalAssessment, vdotFromRace, predictRaceSeconds,
  pacesFor, formatDuration, parseTimeToSeconds, dateKey, addDays, mondayOnOrBefore,
  feasibilityReport, achievableVdotGain, EVENT_REQUIREMENTS,
  deriveFitness, sessionsScheduledForWeek, baselineVdot, parseDateKey,
  pruneCoachOverrides,
} from "./plan-engine.js?v=21";
import { coachRespond } from "./coach.js?v=21";

const out = document.getElementById("out");
let pass = 0, fail = 0;

function section(t) { out.insertAdjacentHTML("beforeend", `<h2>${t}</h2>`); }
function check(label, cond, detail) {
  if (cond) { pass++; out.insertAdjacentHTML("beforeend", `<div class="pass">✓ ${label}</div>`); }
  else { fail++; out.insertAdjacentHTML("beforeend", `<div class="fail">✗ ${label} ${detail ? "— " + detail : ""}</div>`); }
}
function dump(o) { out.insertAdjacentHTML("beforeend", `<pre>${JSON.stringify(o, null, 1)}</pre>`); }

// ---------------------------------------------------------------- physiology
section("VDOT physiology");
const v20 = vdotFromRace(20 * 60, 5000);
check(`20:00 5K → VDOT ${v20.toFixed(1)} (expect ~49–51)`, v20 > 48 && v20 < 52, v20.toFixed(2));
const v25 = vdotFromRace(25 * 60, 5000);
check(`25:00 5K → VDOT ${v25.toFixed(1)} (expect ~38–41)`, v25 > 37 && v25 < 42, v25.toFixed(2));
check("Faster 5K yields higher VDOT", v20 > v25);

const rt = predictRaceSeconds(v20, 5000);
check(`Round-trip 20:00 → VDOT → ${formatDuration(rt)}`, Math.abs(rt - 1200) < 5, `${rt.toFixed(1)}s`);
const half = predictRaceSeconds(v20, 21097);
check(`VDOT ${v20.toFixed(0)} half prediction ${formatDuration(half)} (Daniels table: ~1:31:35)`, half > 5400 && half < 5700);

const p = pacesFor(v20);
check("Easy pace slower than threshold", p.easy > p.threshold);
check("Threshold slower than interval", p.threshold > p.interval);
check("Interval slower than repetition", p.interval > p.repetition);
check(`Easy pace ${formatDuration(p.easy)}/km is plausible for a 20:00 5K runner`, p.easy > 270 && p.easy < 360);

section("Time parsing");
check('"24:30" → 1470s', parseTimeToSeconds("24:30") === 1470);
check('"1:45:00" → 6300s', parseTimeToSeconds("1:45:00") === 6300);
check('"22" → 1320s', parseTimeToSeconds("22") === 1320);
check('"abc" → null', parseTimeToSeconds("abc") === null);
check('"" → null', parseTimeToSeconds("") === null);

// ---------------------------------------------------------------- plan building
function mkUser(over = {}) {
  return {
    name: "Test",
    planStart: dateKey(new Date()),
    profile: {
      workoutsPerWeek: "low", cardioPerWeek: "mid",
      runDuration: "to45", fiveKSeconds: 25 * 60, injuryFocus: ["hamstring"],
      ...(over.profile || {}),
    },
    schedule: { sessionsPerWeek: 4, minutesPerSession: 60, commitments: {}, ...(over.schedule || {}) },
    goal: { type: "endurance", event: "fiveK", targetSeconds: 22 * 60, deadline: dateKey(addDays(new Date(), 84)), ...(over.goal || {}) },
    logs: over.logs || {}, tests: over.tests || {},
  };
}

section("Plan structure");
let u = mkUser();
let a = computeAdaptation(u);
let plan = buildPlan(u, a);
check(`12-week deadline → ${plan.totalWeeks} weeks`, plan.totalWeeks >= 12 && plan.totalWeeks <= 13, String(plan.totalWeeks));
check("Every week has 7 days", plan.weeks.every((w) => w.days.length === 7));
check("Each week schedules the requested session count",
  plan.weeks.every((w) => w.days.filter((d) => !d.isRest).length === 4),
  plan.weeks.map((w) => w.days.filter((d) => !d.isRest).length).join(","));
check("Week 1 is a test week", plan.weeks[0].isTest);
check("Test weeks include week 4", plan.testWeeks.includes(4), plan.testWeeks.join(","));
check("Deload weeks exist", plan.weeks.some((w) => w.isDeload));
check("Taper exists for a 12-week plan", plan.weeks.some((w) => w.isTaper));
check("Phases run Base → Build → Peak → Taper",
  ["Base", "Build", "Peak", "Taper"].every((ph) => plan.weeks.some((w) => w.phase === ph)),
  [...new Set(plan.weeks.map((w) => w.phase))].join(" "));
check("Every session has content lines", plan.weeks.every((w) => w.days.filter((d) => !d.isRest).every((d) => d.session.lines.length > 0)));
check("Deload volume is lower than the week before it", (() => {
  const d = plan.weeks.find((w) => w.isDeload && w.num > 1);
  return d && d.sessionMinutes < plan.weeks[d.num - 2].sessionMinutes;
})());

section("Volume ramp");
const mins = plan.weeks.filter((w) => !w.isDeload && !w.isTaper).map((w) => w.sessionMinutes);
check(`Ramps up over time (${mins.join(" → ")})`, mins[mins.length - 1] > mins[0]);
check("Never exceeds the stated session cap", plan.weeks.every((w) => w.sessionMinutes <= 60));
check("Long run is never shorter than a normal session", plan.weeks.every((w) => w.longMinutes >= w.sessionMinutes), plan.weeks.map((w) => `${w.sessionMinutes}/${w.longMinutes}`).join(" "));
check("Long run is strictly longer whenever the duration ceiling isn't binding",
  plan.weeks.filter((w) => w.longMinutes < 60).every((w) => w.longMinutes > w.sessionMinutes),
  plan.weeks.map((w) => `${w.sessionMinutes}/${w.longMinutes}`).join(" "));

section("Commitments are respected");
u = mkUser({ schedule: { sessionsPerWeek: 4, minutesPerSession: 60, commitments: { 1: { load: "hard", label: "Soccer" }, 3: { load: "hard", label: "Soccer" } } } });
a = computeAdaptation(u); plan = buildPlan(u, a);
check("No sessions on hard-commitment days (Tue/Thu)",
  plan.weeks.every((w) => w.days[1].isRest && w.days[3].isRest));
check("Commitment label carried through", plan.weeks[0].days[1].commitment?.label === "Soccer");
check("Stacked hard commitments raise a total-load warning", plan.warnings.some((w) => w.includes("hard commitment days")), plan.warnings.join(" | "));
check("Still schedules 4 sessions on the remaining 5 days",
  plan.weeks.every((w) => w.days.filter((d) => !d.isRest).length === 4));

section("Over-committed schedule warns instead of failing");
u = mkUser({ schedule: { sessionsPerWeek: 6, minutesPerSession: 60, commitments: { 1: { load: "hard", label: "x" }, 3: { load: "hard", label: "x" }, 5: { load: "hard", label: "x" } } } });
a = computeAdaptation(u); plan = buildPlan(u, a);
check("Warning raised when sessions exceed free days", plan.warnings.length > 0, plan.warnings.join(" | "));
check("Caps at the number of free days", plan.weeks.every((w) => w.days.filter((d) => !d.isRest).length === 4));

section("Long-run ceiling warning");
u = mkUser({ goal: { type: "endurance", event: "marathon", targetSeconds: null, deadline: dateKey(addDays(new Date(), 168)) }, schedule: { sessionsPerWeek: 4, minutesPerSession: 60, commitments: {} } });
a = computeAdaptation(u); plan = buildPlan(u, a);
check("Marathon on 60-min sessions raises a long-run warning", plan.warnings.some((w) => w.includes("long runs")), plan.warnings.join(" | "));
check("Long run grows past the session cap", plan.weeks.some((w) => w.longMinutes > 60), String(Math.max(...plan.weeks.map((w) => w.longMinutes))));

section("General fitness goal");
u = mkUser({ goal: { type: "fitness", fitnessTarget: "allround", deadline: dateKey(addDays(new Date(), 84)) } });
a = computeAdaptation(u); plan = buildPlan(u, a);
check("Builds without paces", plan.paces === null);
check("Uses strength/conditioning session types",
  plan.weeks[1].days.filter((d) => !d.isRest).some((d) => ["lower", "upper", "full", "conditioning"].includes(d.session.type)),
  plan.weeks[1].days.filter((d) => !d.isRest).map((d) => d.session.type).join(","));
check("Test session is a benchmark circuit",
  plan.weeks[0].days.find((d) => d.session?.type === "test")?.session.label.includes("benchmark"));

// ---------------------------------------------------------------- adaptation
section("Adaptation — poor adherence");
const start = mondayOnOrBefore(new Date());
function logsFor(weeksBack, perWeek, rpe) {
  const logs = {};
  for (let w = 0; w < weeksBack; w++) {
    for (let i = 0; i < perWeek; i++) {
      const d = addDays(start, -((w + 1) * 7) + i);
      logs[dateKey(d)] = { done: true, rpe, targetRpe: 6, type: "easy" };
    }
  }
  return logs;
}
// Shift plan start back 3 weeks so there is history to evaluate.
function withHistory(over) {
  const uu = mkUser(over);
  uu.planStart = dateKey(addDays(start, -21));
  return uu;
}
let uLow = withHistory({ logs: {} });
uLow.logs = (() => {
  const logs = {};
  for (let w = 0; w < 3; w++) {
    const d = addDays(addDays(start, -21), w * 7);
    logs[dateKey(d)] = { done: true, rpe: 6, targetRpe: 6, type: "easy" };
  }
  return logs;
})();
let aLow = computeAdaptation(uLow);
check(`Low adherence cuts volume (factor ${aLow.volumeFactor.toFixed(2)})`, aLow.volumeFactor < 1, aLow.volumeFactor.toFixed(3));
check("Adjustment is recorded with a reason", aLow.notes.length > 0, JSON.stringify(aLow.notes.map((n) => n.text)));
check("Two bad weeks drop a session", aLow.sessionsAdjust === -1, String(aLow.sessionsAdjust));

section("Adaptation — strong adherence, easy sessions");
let uHigh = withHistory({});
uHigh.logs = (() => {
  const logs = {};
  for (let w = 0; w < 3; w++)
    for (let i = 0; i < 4; i++)
      logs[dateKey(addDays(addDays(start, -21), w * 7 + i))] = { done: true, rpe: 4, targetRpe: 6, type: "easy" };
  return logs;
})();
let aHigh = computeAdaptation(uHigh);
check(`Full adherence + low RPE raises volume (factor ${aHigh.volumeFactor.toFixed(2)})`, aHigh.volumeFactor > 1, aHigh.volumeFactor.toFixed(3));
check("Volume factor is clamped at 1.15", aHigh.volumeFactor <= 1.15);

section("Adaptation — sessions too hard");
let uHard = withHistory({});
uHard.logs = (() => {
  const logs = {};
  for (let w = 0; w < 3; w++)
    for (let i = 0; i < 4; i++)
      logs[dateKey(addDays(addDays(start, -21), w * 7 + i))] = { done: true, rpe: 9, targetRpe: 6, type: "easy" };
  return logs;
})();
let aHard = computeAdaptation(uHard);
check(`High RPE eases load (factor ${aHard.volumeFactor.toFixed(2)})`, aHard.volumeFactor < 1, aHard.volumeFactor.toFixed(3));

section("Adaptation — test result resets fitness");
let uTest = withHistory({});
uTest.tests = { 1: { type: "run", seconds: 25 * 60, meters: 5000 }, 4: { type: "run", seconds: 23 * 60 + 30, meters: 5000 } };
let aTest = computeAdaptation(uTest);
check("VDOT recalculated from latest test", aTest.vdot !== null && aTest.vdot > 40, String(aTest.vdot?.toFixed(1)));
check("A test recorded in the current week counts immediately",
  Math.abs(aTest.vdot - vdotFromRace(23 * 60 + 30, 5000)) < 0.01,
  `${aTest.vdot?.toFixed(2)} vs ${vdotFromRace(23 * 60 + 30, 5000).toFixed(2)}`);
check("Improvement noted in the adjustment log", aTest.notes.some((n) => n.text.includes("faster")), JSON.stringify(aTest.notes.map((n) => n.text)));
const planTest = buildPlan(uTest, aTest);
check("Plan paces follow the new test result", Math.abs(planTest.vdot - aTest.vdot) < 0.01);

// ---------------------------------------------------------------- goal assessment
section("Goal assessment");
function assessFor(fiveK, target, weeks) {
  const uu = mkUser({ profile: { fiveKSeconds: fiveK }, goal: { type: "endurance", event: "fiveK", targetSeconds: target, deadline: dateKey(addDays(new Date(), weeks * 7)) } });
  const aa = computeAdaptation(uu);
  return goalAssessment(uu, buildPlan(uu, aa), aa);
}
const modest = assessFor(25 * 60, 24 * 60 + 30, 12);
check(`25:00 → 24:30 in 12 weeks reads reachable (${modest.verdict})`, ["ahead", "onTrack"].includes(modest.verdict), modest.verdict);
const wild = assessFor(30 * 60, 18 * 60, 8);
check(`30:00 → 18:00 in 8 weeks reads unrealistic (${wild.verdict})`, wild.verdict === "unrealistic", wild.verdict);
check("Unrealistic verdict suggests a fair alternative", wild.detail.includes("realistic target"), wild.detail);
const already = assessFor(22 * 60, 25 * 60, 12);
check(`22:00 runner targeting 25:00 reads as ahead (${already.verdict})`, already.verdict === "ahead", already.verdict);
check("Fitness goal returns no race assessment", goalAssessment(mkUser({ goal: { type: "fitness", deadline: dateKey(addDays(new Date(), 84)) } }), plan, a) === null);

// ---------------------------------------------------------------- feasibility
section("Feasibility — impossible goals are caught");

function feas(over) { return feasibilityReport(mkUser(over)); }
const sev = (r, level) => r.filter((i) => i.severity === level);

const marathonRush = feas({ goal: { type: "endurance", event: "marathon", targetSeconds: null, deadline: dateKey(addDays(new Date(), 42)) } });
check("Marathon in 6 weeks is a blocker", sev(marathonRush, "blocker").length > 0, JSON.stringify(marathonRush.map((i) => i.title)));
check("Blocker explains the minimum build-up", marathonRush.some((i) => i.detail.includes(String(EVENT_REQUIREMENTS.marathon.minWeeks))));
check("Blocker offers a concrete fix", marathonRush.every((i) => i.fix && i.fix.length > 10));

const fromCouch = feas({ profile: { runDuration: "under10", cardioPerWeek: "none", fiveKSeconds: null }, goal: { type: "endurance", event: "marathon", targetSeconds: null, deadline: dateKey(addDays(new Date(), 200)) } });
check("Marathon from under-10-min base is a blocker even with 28 weeks", sev(fromCouch, "blocker").length > 0, JSON.stringify(fromCouch.map((i) => i.title)));

const wildTime = feas({ profile: { fiveKSeconds: 30 * 60, runDuration: "to30", cardioPerWeek: "low" }, goal: { type: "endurance", event: "fiveK", targetSeconds: 18 * 60, deadline: dateKey(addDays(new Date(), 56)) } });
check("30:00 → 18:00 in 8 weeks is a blocker", sev(wildTime, "blocker").length > 0, JSON.stringify(wildTime.map((i) => i.title)));
check("Time blocker names a reachable alternative", wildTime.some((i) => /\d+:\d\d/.test(i.fix || "")), JSON.stringify(wildTime.map((i) => i.fix)));

const stretch = feas({ profile: { fiveKSeconds: 25 * 60, runDuration: "to45", cardioPerWeek: "mid" }, goal: { type: "endurance", event: "fiveK", targetSeconds: 22 * 60 + 30, deadline: dateKey(addDays(new Date(), 84)) } });
check("A genuine stretch goal warns but doesn't block", sev(stretch, "blocker").length === 0, JSON.stringify(stretch.map((i) => i.severity + ":" + i.title)));

const sane = feas({ profile: { fiveKSeconds: 25 * 60, runDuration: "to45", cardioPerWeek: "mid" }, goal: { type: "endurance", event: "fiveK", targetSeconds: 24 * 60, deadline: dateKey(addDays(new Date(), 84)) } });
check("A reasonable goal produces no blockers", sev(sane, "blocker").length === 0, JSON.stringify(sane.map((i) => i.title)));

const thin = feas({ schedule: { sessionsPerWeek: 2, minutesPerSession: 60, commitments: {} }, goal: { type: "endurance", event: "half", targetSeconds: null, deadline: dateKey(addDays(new Date(), 120)) } });
check("2 sessions a week for a half raises a warning", thin.some((i) => i.title.includes("thin")), JSON.stringify(thin.map((i) => i.title)));

const steep = feas({ profile: { cardioPerWeek: "none", runDuration: "to20", fiveKSeconds: null }, schedule: { sessionsPerWeek: 6, minutesPerSession: 45, commitments: {} } });
check("No cardio → 6 sessions a week raises a ramp warning", steep.some((i) => i.title.includes("steep jump")), JSON.stringify(steep.map((i) => i.title)));

check("Gain model is monotonic in weeks", achievableVdotGain("intermediate", 12) > achievableVdotGain("intermediate", 6));
check("Gain model is capped", achievableVdotGain("beginner", 500) <= 12);
check("Beginners have more headroom than advanced", achievableVdotGain("beginner", 12) > achievableVdotGain("advanced", 12));

// ---------------------------------------------------------------- intensity
section("Ambitious intensity");
u = mkUser(); a = computeAdaptation(u); plan = buildPlan(u, a);
const buildWeek = plan.weeks.find((w) => w.phase === "Build" && !w.isDeload && !w.isTest);
const sessionsIn = (w) => w.days.filter((d) => !d.isRest).map((d) => d.session);

check("Build weeks carry two quality running sessions",
  sessionsIn(buildWeek).filter((x) => ["intervals", "tempo"].includes(x.type)).length === 2,
  sessionsIn(buildWeek).map((x) => x.type).join(","));
check("Intervals target RPE 9", sessionsIn(buildWeek).find((x) => x.type === "intervals")?.targetRpe === 9);
check("Tempo targets RPE 8", sessionsIn(buildWeek).find((x) => x.type === "tempo")?.targetRpe === 8);
check("Easy days are still protected at RPE 4",
  plan.weeks.flatMap(sessionsIn).filter((x) => x.type === "easy").every((x) => x.targetRpe === 4));
check("Intervals include a repetition finisher",
  sessionsIn(buildWeek).find((x) => x.type === "intervals")?.lines.some((l) => l.includes("Finisher")));
check("Long runs carry a fast finish in Build/Peak",
  sessionsIn(buildWeek).find((x) => x.type === "long")?.lines.some((l) => l.includes("Fast finish")));
check("Base-phase long runs have no fast finish",
  !sessionsIn(plan.weeks[1]).find((x) => x.type === "long")?.lines.some((l) => l.includes("Fast finish")));
check("Never more than two hard running days in a week",
  plan.weeks.every((w) => sessionsIn(w).filter((x) => ["intervals", "tempo", "test"].includes(x.type)).length <= 2),
  plan.weeks.map((w) => sessionsIn(w).filter((x) => ["intervals", "tempo", "test"].includes(x.type)).length).join(","));
check("Strength work is taken near failure",
  plan.weeks.flatMap(sessionsIn).find((x) => x.type === "strength")?.lines.some((l) => l.includes("failure")));

section("Beginner tissue guard still overrides ambition");
const begin = mkUser({ profile: { cardioPerWeek: "none", runDuration: "under10", fiveKSeconds: null } });
const beginPlan = buildPlan(begin, computeAdaptation(begin));
check("Beginner with no cardio gets a reduced first two weeks",
  beginPlan.weeks[0].sessionMinutes < beginPlan.weeks[2].sessionMinutes,
  `${beginPlan.weeks[0].sessionMinutes} vs ${beginPlan.weeks[2].sessionMinutes}`);
check("The guard is disclosed, not silent", beginPlan.warnings.some((w) => w.includes("tendons")), beginPlan.warnings.join(" | "));

section("Session length never exceeds what the athlete said they have");
const boosted = buildPlan(mkUser(), { volumeFactor: 1.15, sessionsAdjust: 0, vdot: null, currentWeek: 8, notes: [] });
check("Even at max adaptation boost, sessions stay within the stated cap",
  boosted.weeks.every((w) => w.sessionMinutes <= 60),
  boosted.weeks.map((w) => w.sessionMinutes).join(","));

// ---------------------------------------------------------------- requirements
section("Original requirements coverage");
u = mkUser(); a = computeAdaptation(u); plan = buildPlan(u, a);
const today = plan.weeks[1].days.find((d) => !d.isRest);
check("REQ: training details for the day", today.session.lines.length >= 3 && today.session.minutes > 0);
check("REQ: weekly overview", plan.weeks[1].days.length === 7 && !!plan.weeks[1].focus);
check("REQ: full plan overview exists", plan.weeks.length === plan.totalWeeks && plan.weeks.every((w) => !!w.phase));
check("REQ: key test weeks identified", plan.testWeeks.length >= 2 && plan.weeks.filter((w) => w.isTest).length === plan.testWeeks.length);
check("REQ: fitness inputs all consumed",
  ["workoutsPerWeek", "cardioPerWeek", "fiveKSeconds", "runDuration", "injuryFocus"].every((k) => k in u.profile));
check("REQ: injury prevention appears in the plan",
  plan.weeks.flatMap((w) => w.days).filter((d) => !d.isRest).some((d) => d.session.lines.some((l) => l.startsWith("🩹"))));
check("REQ: schedule inputs all consumed",
  ["sessionsPerWeek", "minutesPerSession", "commitments"].every((k) => k in u.schedule));
check("REQ: goal + deadline drive the plan length", plan.totalWeeks === Math.max(2, Math.ceil((addDays(new Date(), 84) - mondayOnOrBefore(new Date())) / 86400000 + 1) / 7 | 0) || plan.totalWeeks >= 12);
check("REQ: minimum gear is listed", plan.gear.length > 0 && plan.gear.includes("shoes"));
check("REQ: every exercise offers an easier and harder option",
  plan.weeks.flatMap((w) => w.days).filter((d) => d.session?.type === "strength")
    .every((d) => d.session.lines.filter((l) => l.includes("—")).some((l) => l.includes("easier:") && l.includes("harder:"))));
check("REQ: plan adapts to logged sessions", aLow.volumeFactor !== 1 || aHigh.volumeFactor !== 1);
check("REQ: plan adapts to test-week performance", aTest.vdot !== null);

// ---------------------------------------------------------------- derived fitness
section("Fitness is derived, never entered");

// Builds a user whose plan started `weeksAgo` weeks back, with `perWeek`
// sessions logged in every completed week.
function withTraining(weeksAgo, perWeek, over = {}) {
  const uu = mkUser(over);
  uu.planStart = dateKey(addDays(start, -weeksAgo * 7));
  uu.logs = {};
  for (let w = 0; w < weeksAgo; w++) {
    for (let i = 0; i < perWeek; i++) {
      uu.logs[dateKey(addDays(addDays(start, -weeksAgo * 7), w * 7 + i))] =
        { done: true, rpe: 6, targetRpe: 6, type: "easy" };
    }
  }
  return uu;
}

const seedVdot = baselineVdot(mkUser().profile);
const trained = deriveFitness(withTraining(4, 4));
check(`Consistent training raises the estimate (${seedVdot.toFixed(1)} → ${trained.vdot.toFixed(1)})`, trained.vdot > seedVdot);
check("Estimate is flagged as estimated, not measured", trained.confidence === "estimated", trained.confidence);
check("Anchor stays 'onboarding' with no test to anchor to", trained.anchor === "onboarding", trained.anchor);

const idle = deriveFitness(withTraining(4, 0));
check(`No training at all lets it decay (${seedVdot.toFixed(1)} → ${idle.vdot.toFixed(1)})`, idle.vdot < seedVdot);

const partial = deriveFitness(withTraining(4, 2));
check("Half attendance sits between full and none", partial.vdot < trained.vdot && partial.vdot > idle.vdot,
  `${idle.vdot.toFixed(2)} < ${partial.vdot.toFixed(2)} < ${trained.vdot.toFixed(2)}`);

const longRun = deriveFitness(withTraining(40, 4));
check(`Untested drift is capped, not unbounded (40 weeks → ${longRun.vdot.toFixed(1)})`,
  longRun.vdot - seedVdot <= 4.01, `drift ${(longRun.vdot - seedVdot).toFixed(2)}`);

const tested = withTraining(6, 4);
tested.tests = { 3: { type: "run", seconds: 22 * 60, meters: 5000 } };
const tf = deriveFitness(tested);
check("A test overrides the accumulated estimate outright",
  Math.abs(tf.vdot - (vdotFromRace(22 * 60, 5000) + 3 * 0.2)) < 0.7,
  `${tf.vdot.toFixed(2)} from test ${vdotFromRace(22 * 60, 5000).toFixed(2)}`);
check("Anchor becomes the test", tf.anchor === "test" && tf.lastTestWeek === 3);
check("Drift resets at the test", Math.abs(tf.driftSinceAnchor) < 1.5, tf.driftSinceAnchor.toFixed(2));

const fresh = withTraining(2, 4);
fresh.tests = { 2: { type: "run", seconds: 22 * 60, meters: 5000 } };
check("A recent test reads as measured", deriveFitness(fresh).confidence === "measured");

check("The plan's paces follow the derived fitness", (() => {
  const uu = withTraining(4, 4);
  const aa = computeAdaptation(uu);
  const pp = buildPlan(uu, aa);
  return Math.abs(pp.vdot - aa.fitness.vdot) < 0.01;
})());

section("Schedule history keeps past adherence honest");
const histUser = mkUser({ schedule: { sessionsPerWeek: 3, minutesPerSession: 60, commitments: {} } });
histUser.scheduleHistory = [{ fromWeek: 1, sessionsPerWeek: 5 }, { fromWeek: 4, sessionsPerWeek: 3 }];
check("Week 2 is judged against the old count of 5", sessionsScheduledForWeek(histUser, 2) === 5);
check("Week 5 is judged against the new count of 3", sessionsScheduledForWeek(histUser, 5) === 3);
check("Same-week entries collapse rather than stack", (() => {
  // Mirrors the editor's dedup: two edits in week 1 must leave one entry.
  const h = [{ fromWeek: 1, sessionsPerWeek: 4 }];
  const apply = (week, n) => {
    if (h.length && h[h.length - 1].fromWeek === week) h[h.length - 1] = { fromWeek: week, sessionsPerWeek: n };
    else h.push({ fromWeek: week, sessionsPerWeek: n });
  };
  apply(1, 5); apply(1, 6);
  return h.length === 1 && h[0].sessionsPerWeek === 6;
})());
check("Falls back to the current schedule with no history",
  sessionsScheduledForWeek(mkUser({ schedule: { sessionsPerWeek: 4, minutesPerSession: 60, commitments: {} } }), 3) === 4);

section("Editing the goal preserves training history");
const edited = withTraining(5, 4);
const beforeF = deriveFitness(edited).vdot;
const logCount = Object.keys(edited.logs).length;
edited.goal = { type: "endurance", event: "half", targetSeconds: null, deadline: dateKey(addDays(new Date(), 140)) };
const afterPlan = buildPlan(edited, computeAdaptation(edited));
check("Logged sessions survive a goal change", Object.keys(edited.logs).length === logCount);
check("Derived fitness survives a goal change", Math.abs(deriveFitness(edited).vdot - beforeF) < 0.01);
check("The plan re-lengthens to the new deadline", afterPlan.totalWeeks > 15, String(afterPlan.totalWeeks));
check("Week numbering still starts from the original planStart",
  afterPlan.weeks[0].days[0].dateKey === dateKey(mondayOnOrBefore(addDays(start, -35))));

// ---------------------------------------------------------------- coach
section("Coach — understanding what you said");

// A Monday, so weekday arithmetic in the tests is predictable.
const monday = mondayOnOrBefore(new Date());
function coachCtx(over = {}) {
  const uu = mkUser(over);
  uu.planStart = dateKey(monday);
  const aa = computeAdaptation(uu);
  return { user: uu, plan: buildPlan(uu, aa), adaptation: aa, today: monday };
}
function say(msg, over) { return coachRespond(msg, coachCtx(over)); }
const actionTypes = (r) => (r.actions || []).map((a) => a.type);

const rDiff = say("ran 30 min easy instead of the intervals");
check("Recognises doing something different", rDiff.intent === "logActual", rDiff.intent);
check("Logs it as an actual session", actionTypes(rDiff).includes("logActual"));
check("Captures the stated duration", rDiff.actions[0].session.minutes === 30, String(rDiff.actions[0].session.minutes));
check("Reads 'easy' as a low effort", rDiff.actions[0].session.rpe <= 5, String(rDiff.actions[0].session.rpe));

// "instead of the intervals" must attribute the swap to the interval day,
// not to whatever happens to be scheduled today.
const ctxD = coachCtx();
const intervalDay = ctxD.plan.weeks[0].days.find((d) => d.session?.type === "intervals");
check("Attributes the swap to the session actually named",
  !intervalDay || rDiff.actions[0].dateKey === intervalDay.dateKey,
  `logged ${rDiff.actions[0].dateKey}, interval day ${intervalDay?.dateKey}`);
check("Warns that quality was swapped for easy",
  !intervalDay || /quality session/i.test(rDiff.reply), rDiff.reply.slice(0, 140));
check("Says which day it attributed it to when it isn't today",
  !intervalDay || intervalDay.dateKey === dateKey(monday) || /it's the one on your plan/i.test(rDiff.reply));

const rKm = say("did 8k this morning");
check("Understands distance and estimates duration", rKm.actions[0]?.session.minutes > 20, String(rKm.actions[0]?.session.minutes));

const rMiss = say("missed today, no time");
check("Recognises a missed session", rMiss.intent === "missed", rMiss.intent);
check("Either moves it or explains why not",
  actionTypes(rMiss).includes("moveSession") || /no free day|let it go/i.test(rMiss.reply), rMiss.reply.slice(0, 100));

const rWeek = say("I missed the whole week");
check("A written-off week is handled separately", rWeek.intent === "missedWeek", rWeek.intent);
check("Refuses to cram a missed week back in", /not going to try to cram|carries on/i.test(rWeek.reply));

const rBusy = say("can't train Thursday, work dinner");
check("Recognises an unavailable day", rBusy.intent === "unavailable", rBusy.intent);
check("Blocks the day", actionTypes(rBusy).includes("blockDates"));
check("Blocks the right day",
  rBusy.actions[0].dates.every((d) => parseDateKey(d).getDay() === 4), JSON.stringify(rBusy.actions[0].dates));

const rRange = say("I'm away tuesday to thursday");
check("Handles a range of days", rRange.actions[0]?.dates.length === 3, JSON.stringify(rRange.actions[0]?.dates));

const rTired = say("legs are wrecked, everything feels hard");
check("Recognises fatigue", rTired.intent === "ease", rTired.intent);
check("Reduces load", actionTypes(rTired).includes("setLoad") && rTired.actions[0].factor < 1, String(rTired.actions[0]?.factor));
check("Keeps intensity, cuts volume", /intensity targets stay/i.test(rTired.reply));

const rStrong = say("felt great, that was too easy");
check("Recognises feeling strong", rStrong.intent === "push", rStrong.intent);
check("Increases load", rStrong.actions[0]?.factor > 1, String(rStrong.actions[0]?.factor));
check("Refuses to make easy days harder", /won't do is make your easy days harder/i.test(rStrong.reply));

const rGoal = say("I want to run a marathon instead");
check("Refuses to change the goal from chat", rGoal.intent === "goalChange", rGoal.intent);
check("Routes to the goal editor", actionTypes(rGoal).includes("openGoalEditor"));
check("Makes no plan change itself", !actionTypes(rGoal).some((x) => ["setLoad", "logActual", "blockDates"].includes(x)));

const rUnknown = say("what do you think about carbon plated shoes");
check("Admits when it hasn't understood", rUnknown.intent === "unknown", rUnknown.intent);
check("Offers examples instead of guessing", /ran 30 easy|can't train/i.test(rUnknown.reply));
check("Changes nothing when it doesn't understand", rUnknown.actions.length === 0);

section("Coach — injury handling");
const rPain = say("my knee hurts when I run");
check("Pain takes priority over everything else", rPain.intent === "pain", rPain.intent);
check("Removes impact", actionTypes(rPain).includes("softenDays"));
check("Adds prehab for the right area",
  rPain.actions.some((a) => a.type === "addInjuryFocus" && a.part === "knee"), JSON.stringify(actionTypes(rPain)));
check("Tells them to get it looked at", /physio|doctor/i.test(rPain.reply));
check("Does not diagnose", !/you have|diagnosis|it is probably|sounds like tendinitis/i.test(rPain.reply));

const rSevere = say("sharp pain in my achilles and it's swollen, getting worse");
check("Escalates severe descriptions", rSevere.severity === "high", String(rSevere.severity));
check("Says plainly it is out of its depth", /can't tell you what's wrong|not going to pretend/i.test(rSevere.reply));

const rPainNoPart = say("everything hurts");
check("Handles pain with no named body part", rPainNoPart.intent === "pain" && actionTypes(rPainNoPart).includes("softenDays"));

section("Coach — informational answers");
check("Answers what's on today", /today is|rest day|outside your plan/i.test(say("what am I doing today?").reply));
check("Answers pace questions", /Easy —|no running paces/i.test(say("what pace should I run?").reply));
check("Answers when the next test is", /next test|no test weeks/i.test(say("when is my next test?").reply));

section("Coach overrides change the actual plan");
function planWith(overrides, over = {}) {
  const uu = mkUser(over);
  uu.planStart = dateKey(monday);
  uu.coachOverrides = overrides;
  return buildPlan(uu, computeAdaptation(uu));
}

const basePlan = planWith({});
const week1 = basePlan.weeks[0];
const trainingDay = week1.days.find((d) => !d.isRest);

const blockedPlan = planWith({ blockedDates: [trainingDay.dateKey] });
const blockedDay = blockedPlan.weeks[0].days.find((d) => d.dateKey === trainingDay.dateKey);
check("A blocked day has no session", blockedDay.isRest && !blockedDay.session);
check("A blocked day is marked as such", blockedDay.blocked === true);

const restDay = week1.days.find((d) => d.isRest && !d.commitment);
const movedPlan = planWith({ moves: { [trainingDay.dateKey]: restDay.dateKey } });
const src = movedPlan.weeks[0].days.find((d) => d.dateKey === trainingDay.dateKey);
const dst = movedPlan.weeks[0].days.find((d) => d.dateKey === restDay.dateKey);
check("A moved session leaves its original day", src.isRest && !src.session);
check("A moved session lands on the target day", !!dst.session && dst.movedFrom === trainingDay.dateKey);
check("Total sessions are unchanged by a move",
  movedPlan.weeks[0].days.filter((d) => !d.isRest).length === week1.days.filter((d) => !d.isRest).length);

const easedPlan = planWith({ loadFactor: 0.8, loadFactorFromWeek: 1 });
check("A reduced load factor shortens sessions",
  easedPlan.weeks[0].sessionMinutes < basePlan.weeks[0].sessionMinutes,
  `${easedPlan.weeks[0].sessionMinutes} vs ${basePlan.weeks[0].sessionMinutes}`);
check("Load factor still respects the stated session cap",
  planWith({ loadFactor: 1.5, loadFactorFromWeek: 1 }).weeks.every((w) => w.sessionMinutes <= 60));

const softPlan = planWith({ softenUntil: dateKey(addDays(monday, 3)) });
const softRun = softPlan.weeks[0].days.find((d) => d.session && d.session.lowImpact);
check("Softened days swap running for low impact", !!softRun, "no low-impact session found");
check("Low-impact swap keeps duration and effort",
  softRun && /same duration, same effort/i.test(softRun.session.lines[0]));
check("A test is never converted to another modality", (() => {
  const testDay = softPlan.weeks[0].days.find((d) => d.session?.type === "test");
  if (!testDay) return true; // no test inside the window
  return !testDay.session.lowImpact && testDay.session.postponeAdvised === true;
})(), "a time trial on a bike cannot calibrate running paces");
check("Postponing a test is explained, not just imposed", (() => {
  const testDay = softPlan.weeks[0].days.find((d) => d.session?.type === "test");
  return !testDay || /recalibrate every pace/i.test(testDay.session.lines[0]);
})());
check("Sessions after the soften window are untouched",
  softPlan.weeks[2].days.filter((d) => d.session).every((d) => !d.session.lowImpact));

check("A move never stacks two sessions on one day", (() => {
  const other = week1.days.find((d) => !d.isRest && d.dateKey !== trainingDay.dateKey);
  const p2 = planWith({ moves: { [trainingDay.dateKey]: other.dateKey } });
  return p2.weeks[0].days.every((d) => !d.session || typeof d.session === "object");
})());

section("Audit — regressions guarded");

// A hard session logged via chat must still register as harder than prescribed,
// otherwise the "sessions too hard" adaptation can never fire from the coach.
const ctxHard = coachCtx();
const hardDay = ctxHard.plan.weeks[0].days.find((d) => d.session && d.session.targetRpe <= 5);
const rHard = coachRespond("ran 40 min instead of the easy run, rpe 9", ctxHard);
const hardSess = rHard.actions[0]?.session;
check("Coach-logged sessions keep the PRESCRIBED effort, not the reported one",
  !!hardSess && hardSess.plannedRpe !== undefined && hardSess.plannedRpe !== hardSess.rpe,
  hardSess ? `reported ${hardSess.rpe}, prescribed ${hardSess.plannedRpe}` : `no log action (intent ${rHard.intent})`);
check("A session harder than prescribed is recorded as such",
  !!hardSess && hardSess.rpe > hardSess.plannedRpe,
  hardSess ? `${hardSess.rpe} vs ${hardSess.plannedRpe}` : "no log action");

// "brutal" on its own is fatigue, not a session report — check that still holds.
check("Describing a session as brutal is read as fatigue, not a log",
  coachRespond("that easy run was brutal", coachCtx()).intent === "ease");

// Chained moves must not drag one session through two hops.
const ctxM = coachCtx();
const w1 = ctxM.plan.weeks[0];
const sess = w1.days.find((d) => !d.isRest);
const rests = w1.days.filter((d) => d.isRest && !d.commitment);
if (rests.length >= 2) {
  const chained = buildPlan(
    { ...ctxM.user, coachOverrides: { moves: { [sess.dateKey]: rests[0].dateKey, [rests[0].dateKey]: rests[1].dateKey } } },
    ctxM.adaptation
  );
  const landed = chained.weeks[0].days.filter((d) => !d.isRest).length;
  check("Chained moves don't drag a session two hops",
    landed === w1.days.filter((d) => !d.isRest).length,
    `${landed} sessions after chained move vs ${w1.days.filter((d) => !d.isRest).length} before`);
  check("The session lands on the first target, not the second",
    !!chained.weeks[0].days.find((d) => d.dateKey === rests[0].dateKey)?.session);
} else {
  check("Chained moves don't drag a session two hops", true, "not enough rest days to test");
  check("The session lands on the first target, not the second", true, "skipped");
}

// Overrides must not accumulate for the life of the plan.
const staleCo = {
  blockedDates: [dateKey(addDays(monday, -21)), dateKey(addDays(monday, 2))],
  moves: { [dateKey(addDays(monday, -20))]: dateKey(addDays(monday, -18)) },
  loadFactor: 0.9,
};
const prunedCo = pruneCoachOverrides(staleCo, monday);
check("Stale blocked dates are pruned", prunedCo.blockedDates.length === 1, JSON.stringify(prunedCo.blockedDates));
check("Stale moves are pruned", Object.keys(prunedCo.moves).length === 0, JSON.stringify(prunedCo.moves));
check("Current-week entries survive pruning", prunedCo.blockedDates[0] === dateKey(addDays(monday, 2)));
check("Load factor is not touched by pruning", prunedCo.loadFactor === 0.9);
check("Pruning returns null when nothing is stale",
  pruneCoachOverrides({ blockedDates: [dateKey(addDays(monday, 1))], moves: {} }, monday) === null);
check("Pruning handles a missing overrides object", pruneCoachOverrides(null, monday) === null);

// Blocking a day that a session was moved ONTO must not silently lose it twice.
const ctxB = coachCtx();
const bSess = ctxB.plan.weeks[0].days.find((d) => !d.isRest);
const bRest = ctxB.plan.weeks[0].days.find((d) => d.isRest && !d.commitment);
if (bSess && bRest) {
  const both = buildPlan(
    { ...ctxB.user, coachOverrides: { moves: { [bSess.dateKey]: bRest.dateKey }, blockedDates: [bRest.dateKey] } },
    ctxB.adaptation
  );
  const target = both.weeks[0].days.find((d) => d.dateKey === bRest.dateKey);
  check("Blocking a move target clears it cleanly rather than corrupting the week",
    target.isRest && !target.session && target.blocked === true);
} else {
  check("Blocking a move target clears it cleanly rather than corrupting the week", true, "skipped");
}

check("Every generated session still has a label, duration and effort",
  basePlan.weeks.flatMap((w) => w.days).filter((d) => d.session)
    .every((d) => d.session.label && d.session.minutes > 0 && d.session.targetRpe >= 1));

section("Coach — the two cases that failed in the wild");

// 1. "tennis for 1 hour AND a 50 min run" previously logged one 60 min run:
//    the first duration in the sentence won and the second session vanished.
const rMulti = say("I played tennis today for 1 hour and went on 50min run at 5.41 min/km pace");
const mSess = rMulti.actions.find((a) => a.type === "logActual")?.session;
check("Two activities in one message are both captured", !!mSess && mSess.minutes === 110,
  mSess ? `${mSess.minutes} min (expected 110)` : `no log (intent ${rMulti.intent})`);
check("The description names both sessions by name", !!mSess && /tennis/i.test(mSess.label) && /run/i.test(mSess.label),
  mSess?.label);
check("A pace is not mistaken for a duration", !!mSess && mSess.minutes !== 41 && mSess.minutes !== 60,
  `${mSess?.minutes} min`);
check("The run is what counts against a planned run", !!mSess && mSess.type === "run", mSess?.type);
check("The pace is read and commented on", /min\/km|\/km/.test(rMulti.reply), rMulti.reply.slice(-160));

// 2. "add 2 strength sessions on Tuesdays and Thursdays" was not understood at
//    all — the coach had no way to add sessions.
const rAdd = say("Please adjust and add 2 strength sessions (focus upper body with pull-ups and weights): one on Tuesdays and one on Thursdays");
check("Adding standing sessions is understood", rAdd.intent === "addSession", rAdd.intent);
const addAct = rAdd.actions.find((a) => a.type === "addRecurringSessions");
check("It produces an add action", !!addAct, JSON.stringify(rAdd.actions.map((a) => a.type)));
check("Upper body is recognised as the focus", addAct?.sessionType === "upper", addAct?.sessionType);
check("Both requested days are picked up",
  !addAct || (addAct.weekdays.includes(1) || addAct.weekdays.includes(3)),
  JSON.stringify(addAct?.weekdays));
check("It explains what it did", /upper-body strength/i.test(rAdd.reply), rAdd.reply.slice(0, 140));

// The engine must actually place them.
const extraUser = mkUser({ schedule: { sessionsPerWeek: 4, minutesPerSession: 60, commitments: {} } });
extraUser.planStart = dateKey(monday);
extraUser.coachOverrides = { extraSessions: [{ weekday: 1, type: "upper", fromWeek: 1 }, { weekday: 3, type: "upper", fromWeek: 1 }] };
const extraPlan = buildPlan(extraUser, computeAdaptation(extraUser));
// Week 1 is a test week, so one of the two requested days is deliberately left
// clear. Check a normal week for full placement, and the test week separately.
const normalWeek = extraPlan.weeks.find((w) => !w.isTest) || extraPlan.weeks[1];
const addedDays = normalWeek.days.filter((d) => d.addedByCoach);
check("Added sessions appear on both requested days in a normal week",
  addedDays.length === 2, `${addedDays.length} added in week ${normalWeek.num}`);
check("A test week gets one fewer, because the time-trial day stays clear",
  extraPlan.weeks[0].days.filter((d) => d.addedByCoach).length === 1,
  `${extraPlan.weeks[0].days.filter((d) => d.addedByCoach).length} added in week 1`);
const addedSessions = addedDays.map((d) => d.session?.type === "upper" ? d.session : d.extraSession);
check("Added sessions are the requested type",
  addedSessions.every((x) => x && x.type === "upper"), addedSessions.map((x) => x && x.type).join(","));
check("Added sessions include pull-ups in the pool",
  addedSessions.some((x) => x.lines.some((l) => /pull-up/i.test(l))));
check("Adding never destroys the session that was already there",
  extraPlan.weeks.flatMap((w) => w.days).filter((d) => d.extraSession).every((d) => !!d.session),
  "a doubled-up day must keep both");
check("Nothing is ever stacked onto a test day",
  extraPlan.weeks.flatMap((w) => w.days).every((d) => !(d.session?.type === "test" && d.extraSession)),
  "lifting around a max-effort time trial corrupts the result");
check("A day never ends up with more than two sessions",
  extraPlan.weeks.flatMap((w) => w.days).every((d) => !d.extraSession || (d.session && !d.extraSession.extraSession)));
check("Adherence counts added sessions as scheduled",
  sessionsScheduledForWeek(extraUser, 1) === 6, String(sessionsScheduledForWeek(extraUser, 1)));

// Hard commitments must still win.
const busyUser = mkUser({ schedule: { sessionsPerWeek: 4, minutesPerSession: 60, commitments: { 1: { load: "hard", label: "Soccer" } } } });
busyUser.planStart = dateKey(monday);
const rBusyAdd = coachRespond("add a strength session on Tuesdays", {
  user: busyUser, plan: buildPlan(busyUser, computeAdaptation(busyUser)),
  adaptation: computeAdaptation(busyUser), today: monday,
});
check("It refuses to add onto a hard commitment day",
  !rBusyAdd.actions.some((a) => a.type === "addRecurringSessions" && a.weekdays.includes(1)),
  JSON.stringify(rBusyAdd.actions));
check("And says why", /hard commitment/i.test(rBusyAdd.reply), rBusyAdd.reply.slice(0, 160));

// Removal.
const remUser = mkUser();
remUser.planStart = dateKey(monday);
remUser.coachOverrides = { extraSessions: [{ weekday: 1, type: "upper", fromWeek: 1 }] };
const rRem = coachRespond("remove the tuesday session", {
  user: remUser, plan: buildPlan(remUser, computeAdaptation(remUser)),
  adaptation: computeAdaptation(remUser), today: monday,
});
check("Standing sessions can be removed", rRem.actions.some((a) => a.type === "removeRecurringSessions"), rRem.intent);

// "add a run on Tuesdays" mentions an activity but is a schedule request.
check("An add request is not mistaken for a session report",
  say("add an easy run on Wednesdays").intent === "addSession",
  say("add an easy run on Wednesdays").intent);

section("Sample week output");
u = mkUser(); a = computeAdaptation(u); plan = buildPlan(u, a);
dump(plan.weeks[5].days.filter((d) => !d.isRest).map((d) => ({ day: d.weekday, type: d.session.type, min: d.session.minutes, rpe: d.session.targetRpe, first: d.session.lines[1] })));

document.getElementById("summary").innerHTML =
  fail === 0 ? `<span class="pass">ALL ${pass} CHECKS PASSED</span>` : `<span class="fail">${fail} FAILED</span> · ${pass} passed`;
</script>
</body>
